# Render Blueprint Specification for Athena
# https://render.com/docs/blueprint-spec

version: "1"

databases:
  - name: athena-db
    databaseName: athena
    user: athena
    plan: standard
    postgresMajorVersion: "16"

services:
  # Athena API Server (HTTP REST, SSE Chat, Search, Auth, Personalization)
  - type: web
    name: athena-api
    runtime: go
    rootDir: backend
    plan: standard
    buildCommand: go build -o bin/api ./cmd/api && go build -o bin/migrate ./cmd/migrate
    preDeployCommand: ./bin/migrate
    startCommand: ./bin/api
    healthCheckPath: /healthz
    envVars:
      - key: ATHENA_APP_ENV
        value: production
      - key: ATHENA_LOG_LEVEL
        value: info
      - key: ATHENA_LOG_FORMAT
        value: json
      - key: ATHENA_DATABASE_URL
        fromDatabase:
          name: athena-db
          property: connectionString
      - key: ATHENA_DB_MAX_CONNS
        value: "20"
      - key: ATHENA_REDIS_ADDR
        # Point to your Redis instance (host:port) or Render Redis
        value: ""
      - key: ATHENA_JWT_SECRET
        generateValue: true
      - key: ATHENA_ADMIN_TOKEN
        generateValue: true
      - key: LLM_PROVIDER
        # Choose: gemini (default if using Google AI Studio), openai_compatible, or stub
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: EMBEDDING_PROVIDER
        # Use 'none' when using Gemini (uses internal stub embedder without requiring OpenAI)
        value: none
      - key: EMBEDDING_DIM
        value: "1536"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SEMANTICSCHOLAR_API_KEY
        sync: false
      - key: OPENALEX_MAILTO
        # Simply your email (e.g. yourname@gmail.com) for polite pool access
        sync: false

  # Athena River Background Ingestion & Research Intelligence Worker
  - type: worker
    name: athena-worker
    runtime: go
    rootDir: backend
    plan: standard
    buildCommand: go build -o bin/worker ./cmd/worker
    startCommand: ./bin/worker
    envVars:
      - key: ATHENA_APP_ENV
        value: production
      - key: ATHENA_LOG_LEVEL
        value: info
      - key: ATHENA_LOG_FORMAT
        value: json
      - key: ATHENA_DATABASE_URL
        fromDatabase:
          name: athena-db
          property: connectionString
      - key: ATHENA_DB_MAX_CONNS
        value: "10"
      - key: ATHENA_REDIS_ADDR
        value: ""
      - key: ATHENA_WORKER_CONCURRENCY
        value: "4"
      - key: ATHENA_INGESTION_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        # Choose: gemini (default if using Google AI Studio), openai_compatible, or stub
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: EMBEDDING_PROVIDER
        # Use 'none' when using Gemini (uses internal stub embedder without requiring OpenAI)
        value: none
      - key: EMBEDDING_DIM
        value: "1536"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SEMANTICSCHOLAR_API_KEY
        sync: false
      - key: OPENALEX_MAILTO
        # Simply your email (e.g. yourname@gmail.com) for polite pool access
        sync: false
