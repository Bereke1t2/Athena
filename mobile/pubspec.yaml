name: athena
description: "Athena — Discover. Understand. Question. Connect."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.11.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  cupertino_icons: ^1.0.8
  riverpod_annotation: ^2.6.1
  collection: ^1.19.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  flutter_pdfview: ^1.4.5
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  riverpod_generator: ^2.6.4
  mocktail: ^1.0.5
  path: ^1.9.1

flutter:
  uses-material-design: true
